<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordspel Musea Kaart — Frysk & Grunn</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h1>Bordspel Musea</h1>
                <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Sluit sidebar">✕</button>
            </div>

            <div class="sidebar-actions">
                <button id="share-btn" class="btn btn-share">📋 Deel link</button>
                <button id="reset-btn" class="btn btn-reset">↺ Reset</button>
                <label class="toggle-visited">
                    <input type="checkbox" id="hide-visited-toggle">
                    <span>Verberg bezochte op kaart</span>
                </label>
            </div>

            <div class="sidebar-section">
                <div class="section-header" data-section="frysk">
                    <h2>Frysk</h2>
                    <span class="progress" id="progress-frysk">0 / 42</span>
                </div>
                <ul class="museum-list" id="list-frysk"></ul>
            </div>

            <div class="sidebar-section">
                <div class="section-header" data-section="grunn">
                    <h2>Grunn</h2>
                    <span class="progress" id="progress-grunn">0 / 31</span>
                </div>
                <ul class="museum-list" id="list-grunn"></ul>
            </div>
        </aside>

        <div id="map-container">
            <button id="sidebar-open" class="sidebar-open-btn" aria-label="Open sidebar">☰</button>
            <div id="map"></div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/app.js"></script>
</body>

</html>
